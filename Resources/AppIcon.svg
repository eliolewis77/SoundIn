<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2C2A"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle 底板 -->
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#bg)"/>

  <!-- 左侧白色声波（渐弱）——等间距排布，间距 48 = 条宽，整体居中 -->
  <g fill="#FFFFFF">
    <rect x="284" y="432" width="48" height="160" rx="24"/>
    <rect x="380" y="368" width="48" height="288" rx="24" opacity="0.8"/>
    <rect x="476" y="304" width="48" height="416" rx="24" opacity="0.55"/>
  </g>

  <!-- 绿色输入块 -->
  <rect x="572" y="320" width="80" height="384" rx="34" fill="#97C459"/>

  <!-- 白色 I 型文字光标 -->
  <rect x="700" y="320" width="40" height="384" rx="20" fill="#FFFFFF"/>
</svg>
