name: Release

# ⚠️ 正常发版不要走这里：CI 无开发者证书，产物 ad-hoc 签名（1.0.2 曾启动即崩）。
# 发版用 scripts/release.sh（本地 Developer ID 签名 + 公证，证书/公证档/Sparkle
# 私钥都在本机钥匙串）。本工作流仅保留手动触发作兜底；「已发版」判定为
# 「tag 存在且线上 appcast 已含该版本」，所以本地发过的版本在这里重跑会自动跳过。
#
# 未配置签名密钥时回退临时签名（ad-hoc），仍可发版但别人下载后需手动绕开 Gatekeeper。
#
# 真实签名 + 公证（可选）：在仓库 Settings → Secrets 配置以下密钥后，CI 会自动导入证书、用
# Developer ID 签名并对产物做 notarize + staple，别人可直接双击打开：
#   MACOS_SIGN_CERT_P12       导出的 .p12（base64 编码字符串）
#   MACOS_SIGN_CERT_PASSWORD  .p12 的导出密码
#   MACOS_SIGN_IDENTITY       证书身份，如 "Developer ID Application: Your Name (TEAMID)"
#   MACOS_NOTARIZE_KEY_P8     App Store Connect API Key 的 .p8（base64 编码字符串）
#   MACOS_NOTARIZE_KEY_ID     API Key ID（如 "ABCDE12345"）
#   MACOS_NOTARIZE_ISSUER     Issuer ID（UUID）
#
# Sparkle 自动更新：
#   SPARKLE_PRIVATE_KEY       EdDSA 私钥（Sparkle 的 generate_keys -x 导出，base64 编码字符串）
#                             必须配置，否则签名步骤跳过、appcast 不含签名，客户端会拒绝安装更新。
#   SPARKLE_PUBLIC_ED_KEY     对应公钥（可选；不设时用 Info.plist 里已写死的 SUPublicEDKey）
# appcast.xml 发布到 gh-pages 分支，客户端从 https://eliolewis77.github.io/SoundIn/appcast.xml 拉取。
on:
  workflow_dispatch:   # 仅手动兜底；常规发版走 scripts/release.sh

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整标签历史用于「是否已发版」判断与自动变更说明

      - name: Read version from Info.plist
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if already released
        id: check
        run: |
          # 只有「标签已存在 且 线上 appcast 已含该版本」才算发过版：
          # 若 Release 建好但 appcast 步骤失败，重跑不应整体跳过
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q . \
            && curl -sf "https://eliolewis77.github.io/SoundIn/appcast.xml" \
                | grep -q "sparkle:version=\"${{ steps.version.outputs.version }}\""; then
            echo "Tag v${{ steps.version.outputs.version }} already released (appcast live) — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        id: sign
        if: steps.check.outputs.exists == 'false'
        env:
          CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          CERT_PASS: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "$CERT_P12" | base64 --decode > /tmp/sign.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import /tmp/sign.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            rm -f /tmp/sign.p12
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing certificate secrets found — falling back to ad-hoc signature."
          fi

      - name: Build app
        if: steps.check.outputs.exists == 'false'
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.enabled == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          chmod +x build-app.sh
          ./build-app.sh
          cd .build-cache/app
          /usr/bin/ditto -c -k --keepParent SoundIn.app SoundIn.app.zip

      - name: Notarize and staple
        if: steps.check.outputs.exists == 'false' && steps.sign.outputs.enabled == 'true'
        env:
          KEY_P8: ${{ secrets.MACOS_NOTARIZE_KEY_P8 }}
          KEY_ID: ${{ secrets.MACOS_NOTARIZE_KEY_ID }}
          ISSUER: ${{ secrets.MACOS_NOTARIZE_ISSUER }}
        run: |
          echo "$KEY_P8" | base64 --decode > "/tmp/AuthKey_${KEY_ID}.p8"
          APP_ZIP="$GITHUB_WORKSPACE/.build-cache/app/SoundIn.app.zip"
          APP="$GITHUB_WORKSPACE/.build-cache/app/SoundIn.app"
          xcrun notarytool submit "$APP_ZIP" \
            --key "/tmp/AuthKey_${KEY_ID}.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER" \
            --wait
          xcrun stapler staple "$APP"
          cd "$GITHUB_WORKSPACE/.build-cache/app"
          /usr/bin/ditto -c -k --keepParent SoundIn.app SoundIn.app.zip
          rm -f "/tmp/AuthKey_${KEY_ID}.p8"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ github.workspace }}/.build-cache/app/SoundIn.app.zip
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            "$ARTIFACT"

      # ── Sparkle 自动更新 ──
      # 依赖 generate_appcast：它会对 zip 做 EdDSA 签名并生成 appcast.xml。
      # 公钥必须与 Info.plist 的 SUPublicEDKey 一致，否则客户端拒绝安装。
      - name: Set up Sparkle tools
        if: steps.check.outputs.exists == 'false'
        run: |
          SPARKLE_VERSION="2.10.0"
          curl -sL --max-time 120 -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle-tools
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
          # 自检用 --help：generate_appcast 没有 --version 参数（会因缺
          # <archives-source-dir> 以 64 退出，白挂一步）
          /tmp/sparkle-tools/bin/generate_appcast --help > /dev/null

      - name: Sign update and generate appcast
        if: steps.check.outputs.exists == 'false'
        env:
          SPARKLE_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY_B64" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY 未配置，跳过 appcast 生成（自动更新不可用）"
            exit 0
          fi
          echo "$SPARKLE_PRIVATE_KEY_B64" | base64 --decode > /tmp/sparkle_private_key 2>/dev/null || true
          # 密钥格式自适应：generate_appcast 要求密钥文件是 generate_keys -x 导出的
          # 文本（一行 base64）。若 secret 存的就是这个原文，先解码会得到非法 UTF-8
          # 的二进制（generate_appcast 报 "Unable to read EdDSA private key data as
          # UTF-8 string"），此时直接把原文当密钥文件用。
          if ! /usr/bin/iconv -f UTF-8 -t UTF-8 /tmp/sparkle_private_key > /dev/null 2>&1; then
            printf '%s\n' "$SPARKLE_PRIVATE_KEY_B64" > /tmp/sparkle_private_key
            echo "secret 不是 base64(密钥文件)，已按密钥文件原文使用"
          fi
          chmod 600 /tmp/sparkle_private_key
          # 私钥不留痕：无论 generate_appcast 成败，退出时都删掉（rm 只在成功路径
          # 执行的话，签名失败会把 EdDSA 私钥留在 runner 的 /tmp 里）
          trap 'rm -f /tmp/sparkle_private_key' EXIT
          cd .build-cache/app
          # generate_appcast 对目录里的 zip 做 EdDSA 签名并写出 appcast.xml。
          # enclosure URL 由它按 feed 地址自动推导（固定为 <feed目录>/SoundIn.app.zip），
          # 所以 zip 必须与 appcast.xml 一起平铺发布在 Pages 根目录，不能再套一层目录。
          /tmp/sparkle-tools/bin/generate_appcast \
            --ed-key-file /tmp/sparkle_private_key \
            .
          echo "--- appcast.xml ---"
          cat appcast.xml

      - name: Publish appcast to gh-pages
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .build-cache/app
          if [ ! -f appcast.xml ]; then
            echo "appcast.xml 不存在，跳过发布（未配置 SPARKLE_PRIVATE_KEY？）"
            exit 0
          fi
          # 只提交 appcast.xml 与 zip：客户端只信任 Pages 这一个域名，
          # 不必再去 Release 页取更新包
          git init -q .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B gh-pages
          git add appcast.xml SoundIn.app.zip
          git commit -q -m "appcast: v${{ steps.version.outputs.version }}" || {
            echo "没有变更，跳过推送"; exit 0; }
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "appcast published to gh-pages"
