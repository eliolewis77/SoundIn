<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>去掉句末标点 · 设计稿</title>
<style>
  :root{
    --bg:#1c1c1e; --panel:#2c2c2e; --line:#3a3a3c; --text:#f5f5f7;
    --sub:#98989d; --accent:#0a84ff; --chip:#3a3a3c;
  }
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;}
  body{margin:0;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:40px 16px;}
  .window{width:560px;background:var(--panel);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line);}
  .titlebar{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);}
  .dot{width:11px;height:11px;border-radius:50%;margin-right:7px;}
  .dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
  .body{padding:22px 24px 26px;}
  h2{font-size:15px;font-weight:600;margin:0 0 4px;}
  .section{border:1px solid var(--line);border-radius:10px;margin-top:14px;overflow:hidden;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);}
  .row:first-of-type{border-top:none;}
  .label{font-size:13px;}
  .hint{font-size:12px;color:var(--sub);margin-top:3px;max-width:330px;line-height:1.45;}
  /* macOS switch */
  .switch{position:relative;width:42px;height:25px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--chip);border-radius:25px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;height:21px;width:21px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(17px);}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span style="margin-left:10px;">SoundIn · 设置 · 通用</span>
  </div>
  <div class="body">
    <h2>通用</h2>

    <div class="section">
      <div class="row">
        <div class="label">开机时启动</div>
        <label class="switch"><input type="checkbox"><span class="slider"></span></label>
      </div>
    </div>

    <div class="section">
      <div class="row">
        <div>
          <div class="label">去掉句末标点</div>
          <div class="hint">开启后，转写结果在输入前会删掉结尾最后一个标点（如「你好。」→「你好」）。默认关闭。</div>
        </div>
        <label class="switch"><input type="checkbox"><span class="slider"></span></label>
      </div>
    </div>
  </div>
</div>
</body>
</html>
